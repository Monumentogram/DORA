name: POC Search Full Benchmark

on:
  workflow_dispatch:
  push:
    tags:
      - "poc-search-001-full-*"

permissions:
  contents: read

concurrency:
  group: poc-search-full-${{ github.sha }}
  cancel-in-progress: false

jobs:
  full-search-benchmark:
    name: full-search-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android API 36 emulator
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools"
          "emulator"
          "platforms;android-36"
          "build-tools;36.0.0"
          "system-images;android-36;google_apis;x86_64"

      - name: Validate frozen contracts before execution
        run: python3 tools/validate_poc_search.py

      - name: Compile the exact benchmark harness
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :poc:search:testDebugUnitTest
          :poc:search:compileDebugAndroidTestKotlin
          :poc:search:lintDebug

      - name: Create API 36 full benchmark AVD
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-full-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
              --force \
              --name dora_search_full \
              --package "system-images;android-36;google_apis;x86_64" \
              --device pixel_6

      - name: Start isolated full benchmark emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-full-avd
        run: |
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_search_full \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect -accel on -memory 4096 \
            > "${RUNNER_TEMP}/dora-search-full-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              tail -n 500 "${RUNNER_TEMP}/dora-search-full-emulator.log"
              exit 1
            fi
            boot_completed=$("${ANDROID_HOME}/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot_completed}" = "1" ]; then
              "${ANDROID_HOME}/platform-tools/adb" shell settings put global window_animation_scale 0
              "${ANDROID_HOME}/platform-tools/adb" shell settings put global transition_animation_scale 0
              "${ANDROID_HOME}/platform-tools/adb" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 5
          done
          tail -n 500 "${RUNNER_TEMP}/dora-search-full-emulator.log"
          exit 1

      - name: Run frozen 10k conversation and 1M row campaign
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :poc:search:connectedDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.monumentogram.dora.poc.search.FullSearchBenchmarkInstrumentedTest
          -Pandroid.testInstrumentationRunnerArguments.pocSearchFull=true

      - name: Pull sanitized observations and verify no database was retained
        run: |
          observation_path=$("${ANDROID_HOME}/platform-tools/adb" shell find /sdcard/Android/data -type f -name benchmark-observations.json | tr -d '\r' | head -n 1)
          test -n "${observation_path}"
          mkdir -p "${RUNNER_TEMP}/poc-search-observations"
          "${ANDROID_HOME}/platform-tools/adb" pull "${observation_path}" "${RUNNER_TEMP}/poc-search-observations/benchmark-observations.json"
          retained_database=$("${ANDROID_HOME}/platform-tools/adb" shell find /data/user/0 -type f \( -name 'poc-search-reference-primary.db' -o -name 'poc-search-reference-secondary.db' \) 2>/dev/null | tr -d '\r')
          test -z "${retained_database}"

      - name: Finalize and schema-validate sanitized evidence
        run: >-
          python3 tools/finalize_poc_search_result.py
          --observations "${RUNNER_TEMP}/poc-search-observations/benchmark-observations.json"
          --output-dir "${RUNNER_TEMP}/poc-search-evidence"
          --expected-commit "${GITHUB_SHA}"

      - name: Upload commit-bound benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poc-search-001-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/poc-search-evidence
            ${{ runner.temp }}/poc-search-observations/benchmark-observations.json
          if-no-files-found: error
          retention-days: 14

      - name: Print emulator log on failure
        if: failure()
        run: tail -n 500 "${RUNNER_TEMP}/dora-search-full-emulator.log"
