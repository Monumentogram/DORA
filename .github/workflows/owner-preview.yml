name: Owner Preview parallel Alpha software

on:
  push:
    branches: ["codex/parallel-alpha-preview", "codex/alpha-v9-recording-stabilization"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-preview-software:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          validate-wrappers: true
      - run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Pilot variant JVM, UI compilation, lint and release dependency boundary (public inputs only)
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          -PdoraTestBuildType=ownerPreview -PdoraOwnerPreviewInstrumentationSigning=true
          spotlessCheck detekt :core:audio:testDebugUnitTest :core:audio:testReleaseUnitTest
          :poc:recovery:testDebugUnitTest :ml:vad-api:testDebugUnitTest :ml:vad-sherpa:testDebugUnitTest
          :app:testOwnerPreviewUnitTest :app:lintOwnerPreview
          :app:assembleOwnerPreview :app:assembleOwnerPreviewAndroidTest
          :core:audio:assembleDebugAndroidTest
      - name: Host denial controls and native packaging
        run: |
          python3 -m unittest discover -s tools -p 'test_owner*.py'
          python3 -m unittest discover -s tools -p 'test_parallel_packages.py'
          python3 -m unittest discover -s tools -p 'test_pin_free_local_access.py'
          python3 -m unittest discover -s tools -p 'test_version_label.py'
          python3 -m unittest discover -s tools -p 'test_encrypted_persistence_device.py'
          python3 -m unittest discover -s tools -p 'test_recording_library_projection_contract.py'
          python3 tools/validate_pin_free_local_access.py
          python3 tools/verify_apk_native_alignment.py android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk --allowlist android/product-native-libs-allowlist.txt
      - name: Audit actual pilot Manifest, DEX, release denials and disposable signing
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          apk = pathlib.Path('android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk')
          signer = subprocess.run([str(sdk / 'build-tools/36.0.0/apksigner'), 'verify', '--print-certs', str(apk)],
                                  capture_output=True, text=True, check=True)
          pins = re.findall(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signer.stdout, re.M)
          if len(pins) != 1:
              raise SystemExit('PILOT_TEST_SIGNER_NOT_CONFIRMED')
          subprocess.run([sys.executable, 'tools/owner_preview_artifact.py', '--mode', 'ci-test-signed',
                          '--apk', str(apk), '--sdk', str(sdk), '--source-sha', os.environ['GITHUB_SHA'],
                          '--certificate-sha256', pins[0].lower(), '--receipt',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-preview-artifact.json')], check=True)
          PY
      - name: Publish shared synthetic persistence test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-preview-persistence-test-apk
          path: android/core/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish synthetic software results only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-preview-software
          path: |
            android/app/build/test-results/testOwnerPreviewUnitTest/*.xml
            android/app/build/reports/lint-results-ownerPreview.xml
            ${{ runner.temp }}/owner-preview-artifact.json
          retention-days: 7
          if-no-files-found: error

  owner-preview-device:
    name: owner-preview-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Install SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Compile actual pilot variant with disposable instrumentation signer and public inputs only
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          -PdoraTestBuildType=ownerPreview -PdoraOwnerPreviewInstrumentationSigning=true
          :app:assembleOwnerPreview :app:assembleOwnerPreviewAndroidTest
      - name: Audit actual pilot Manifest, DEX, release denials and disposable signing
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          apk = pathlib.Path('android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk')
          signer = subprocess.run([str(sdk / 'build-tools/36.0.0/apksigner'), 'verify', '--print-certs', str(apk)],
                                  capture_output=True, text=True, check=True)
          pins = re.findall(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signer.stdout, re.M)
          if len(pins) != 1:
              raise SystemExit('PILOT_TEST_SIGNER_NOT_CONFIRMED')
          subprocess.run([sys.executable, 'tools/owner_preview_artifact.py', '--mode', 'ci-test-signed',
                          '--apk', str(apk), '--sdk', str(sdk), '--source-sha', os.environ['GITHUB_SHA'],
                          '--certificate-sha256', pins[0].lower(), '--receipt',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-preview-artifact.json')], check=True)
          PY
      - name: Create disposable emulator
        id: emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/owner-preview-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name dora_owner_alpha_pilot --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_owner_alpha_pilot -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on -memory 2048 > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "${emulator_pid}" 2>/dev/null || exit 1
            boot=$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot}" = "1" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: PIN_FREE_LOCAL_ACCESS pilot UI, reboot, exact deletion and cross-user isolation with and without system PIN
        run: >-
          python3 tools/run_owner_pilot_device.py --preview
          --inventory docs/contracts/owner-preview-device-tests-v1.json
          --serial emulator-5554 --expected-api ${{ matrix.api }}
          --apk android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk
          --test-apk android/app/build/outputs/apk/androidTest/ownerPreview/app-ownerPreview-androidTest.apk
          --receipt "${RUNNER_TEMP}/owner-preview/pilot.json"
      - name: Publish pilot UI receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-preview-ui-api${{ matrix.api }}
          path: ${{ runner.temp }}/owner-preview/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish content-free synthetic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-preview-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/owner-preview/*.json
            ${{ runner.temp }}/owner-preview-artifact.json
          retention-days: 7
          if-no-files-found: error

  owner-preview-persistence:
    name: owner-preview-persistence-api${{ matrix.api }}-shard${{ matrix.shard }}
    needs: owner-preview-software
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: owner-preview-persistence-test-apk
          path: persistence-apk
      - name: Install disposable emulator SDK inputs
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "emulator"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Create disposable persistence emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/owner-preview-persistence-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name dora_owner_persistence --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_owner_persistence -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on -memory 2048 > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "${emulator_pid}" 2>/dev/null || exit 1
            boot=$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot}" = "1" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Exact 47-method persistence shard in both PIN states with original controls
        run: >-
          python3 tools/run_encrypted_persistence_device.py
          --serial emulator-5554 --expected-api ${{ matrix.api }} --expected-page-size 4096
          --apk persistence-apk/audio-debug-androidTest.apk
          --inventory docs/contracts/alpha-v9-persistence-tests-v1.json --exact-inventory
          --shard-index ${{ matrix.shard }} --shard-count 4
          --receipt "${RUNNER_TEMP}/owner-preview-persistence/persistence.json"
      - name: Publish content-free shard receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-preview-persistence-api${{ matrix.api }}-shard${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/owner-preview-persistence/*.json
            ${{ runner.temp }}/owner-preview-persistence/persistence-diagnostics/*.json*
          retention-days: 7
          if-no-files-found: error

  parallel-package-isolation:
    name: parallel-package-isolation-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Install SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Compile synthetic Pilot peer and preserve its APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon --dependency-verification strict -PdoraTestBuildType=ownerPilot -PdoraOwnerPilotInstrumentationSigning=true :app:assembleOwnerPilot :app:assembleOwnerPilotAndroidTest
          mkdir -p "${RUNNER_TEMP}/pilot-peer"
          cp app/build/outputs/apk/ownerPilot/app-ownerPilot.apk "${RUNNER_TEMP}/pilot-peer/app.apk"
          cp app/build/outputs/apk/androidTest/ownerPilot/app-ownerPilot-androidTest.apk "${RUNNER_TEMP}/pilot-peer/test.apk"
      - name: Compile actual pilot variant with disposable instrumentation signer and public inputs only
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          -PdoraTestBuildType=ownerPreview -PdoraOwnerPreviewInstrumentationSigning=true
          :app:assembleOwnerPreview :app:assembleOwnerPreviewAndroidTest
      - name: Audit actual pilot Manifest, DEX, release denials and disposable signing
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          apk = pathlib.Path('android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk')
          signer = subprocess.run([str(sdk / 'build-tools/36.0.0/apksigner'), 'verify', '--print-certs', str(apk)],
                                  capture_output=True, text=True, check=True)
          pins = re.findall(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signer.stdout, re.M)
          if len(pins) != 1:
              raise SystemExit('PILOT_TEST_SIGNER_NOT_CONFIRMED')
          subprocess.run([sys.executable, 'tools/owner_preview_artifact.py', '--mode', 'ci-test-signed',
                          '--apk', str(apk), '--sdk', str(sdk), '--source-sha', os.environ['GITHUB_SHA'],
                          '--certificate-sha256', pins[0].lower(), '--receipt',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-preview-artifact.json')], check=True)
          PY
      - name: Create disposable emulator
        id: emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/owner-preview-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name dora_owner_alpha_pilot --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_owner_alpha_pilot -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on -memory 2048 > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "${emulator_pid}" 2>/dev/null || exit 1
            boot=$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot}" = "1" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Dual package file and Keystore isolation, Preview removal preserves Pilot
        run: >-
          python3 tools/run_parallel_packages.py
          --serial emulator-5554 --expected-api ${{ matrix.api }}
          --pilot "${RUNNER_TEMP}/pilot-peer/app.apk" --pilot-test "${RUNNER_TEMP}/pilot-peer/test.apk"
          --preview android/app/build/outputs/apk/ownerPreview/app-ownerPreview.apk
          --preview-test android/app/build/outputs/apk/androidTest/ownerPreview/app-ownerPreview-androidTest.apk
          --receipt "${RUNNER_TEMP}/parallel-isolation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-package-isolation-api${{ matrix.api }}
          path: ${{ runner.temp }}/parallel-isolation.json
          retention-days: 7
          if-no-files-found: error
