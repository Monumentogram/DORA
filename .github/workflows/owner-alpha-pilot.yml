name: Owner Alpha pilot software

on:
  push:
    branches: ["codex/isolated-owner-alpha-pilot", "codex/implement-pin-free-dora"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-alpha-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-alpha-pilot-software:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          validate-wrappers: true
      - run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Pilot variant JVM, UI compilation, lint and release dependency boundary (public inputs only)
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          -PdoraTestBuildType=ownerPilot -PdoraOwnerPilotInstrumentationSigning=true
          spotlessCheck detekt :core:audio:testDebugUnitTest :core:audio:testReleaseUnitTest
          :poc:recovery:testDebugUnitTest :ml:vad-api:testDebugUnitTest :ml:vad-sherpa:testDebugUnitTest
          :app:testOwnerPilotUnitTest :app:lintOwnerPilot
          :app:assembleOwnerPilot :app:assembleOwnerPilotAndroidTest
      - name: Host denial controls and native packaging
        run: |
          python3 -m unittest discover -s tools -p 'test_owner*.py'
          python3 -m unittest discover -s tools -p 'test_pin_free_local_access.py'
          python3 -m unittest discover -s tools -p 'test_version_label.py'
          python3 -m unittest discover -s tools -p 'test_encrypted_persistence_device.py'
          python3 tools/validate_pin_free_local_access.py
          python3 tools/verify_apk_native_alignment.py android/app/build/outputs/apk/ownerPilot/app-ownerPilot.apk --allowlist android/product-native-libs-allowlist.txt
      - name: Audit actual pilot Manifest, DEX, release denials and disposable signing
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          apk = pathlib.Path('android/app/build/outputs/apk/ownerPilot/app-ownerPilot.apk')
          signer = subprocess.run([str(sdk / 'build-tools/36.0.0/apksigner'), 'verify', '--print-certs', str(apk)],
                                  capture_output=True, text=True, check=True)
          pins = re.findall(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signer.stdout, re.M)
          if len(pins) != 1:
              raise SystemExit('PILOT_TEST_SIGNER_NOT_CONFIRMED')
          subprocess.run([sys.executable, 'tools/owner_alpha_pilot_artifact.py', '--mode', 'ci-test-signed',
                          '--apk', str(apk), '--sdk', str(sdk), '--source-sha', os.environ['GITHUB_SHA'],
                          '--certificate-sha256', pins[0].lower(), '--receipt',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-alpha-pilot-artifact.json')], check=True)
          PY
      - name: Publish synthetic software results only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-alpha-pilot-software
          path: |
            android/app/build/test-results/testOwnerPilotUnitTest/*.xml
            android/app/build/reports/lint-results-ownerPilot.xml
            ${{ runner.temp }}/owner-alpha-pilot-artifact.json
          retention-days: 7
          if-no-files-found: error

  owner-alpha-pilot-device:
    name: owner-alpha-pilot-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Install SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Compile actual pilot variant with disposable instrumentation signer and public inputs only
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace --dependency-verification strict
          -PdoraTestBuildType=ownerPilot -PdoraOwnerPilotInstrumentationSigning=true
          :app:assembleOwnerPilot :app:assembleOwnerPilotAndroidTest
      - name: Audit actual pilot Manifest, DEX, release denials and disposable signing
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          apk = pathlib.Path('android/app/build/outputs/apk/ownerPilot/app-ownerPilot.apk')
          signer = subprocess.run([str(sdk / 'build-tools/36.0.0/apksigner'), 'verify', '--print-certs', str(apk)],
                                  capture_output=True, text=True, check=True)
          pins = re.findall(r'^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signer.stdout, re.M)
          if len(pins) != 1:
              raise SystemExit('PILOT_TEST_SIGNER_NOT_CONFIRMED')
          subprocess.run([sys.executable, 'tools/owner_alpha_pilot_artifact.py', '--mode', 'ci-test-signed',
                          '--apk', str(apk), '--sdk', str(sdk), '--source-sha', os.environ['GITHUB_SHA'],
                          '--certificate-sha256', pins[0].lower(), '--receipt',
                          str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-alpha-pilot-artifact.json')], check=True)
          PY
      - name: Create disposable emulator
        id: emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/owner-alpha-pilot-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name dora_owner_alpha_pilot --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_owner_alpha_pilot -port 5554 \
            -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -accel on -memory 2048 > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "${emulator_pid}" 2>/dev/null || exit 1
            boot=$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot}" = "1" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: PIN_FREE_LOCAL_ACCESS pilot UI, reboot, exact deletion and cross-user isolation with and without system PIN
        run: >-
          python3 tools/run_owner_pilot_device.py
          --serial emulator-5554 --expected-api ${{ matrix.api }}
          --apk android/app/build/outputs/apk/ownerPilot/app-ownerPilot.apk
          --test-apk android/app/build/outputs/apk/androidTest/ownerPilot/app-ownerPilot-androidTest.apk
          --receipt "${RUNNER_TEMP}/owner-alpha-pilot/pilot.json"
      - name: Compile persistence regression APK
        id: persistence_compile
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        working-directory: android
        run: ./gradlew --no-daemon --dependency-verification strict :core:audio:assembleDebugAndroidTest
      - name: PIN_FREE_LOCAL_ACCESS complete encrypted persistence inventory with and without system PIN
        if: ${{ !cancelled() && steps.persistence_compile.outcome == 'success' }}
        run: >-
          python3 tools/run_encrypted_persistence_device.py
          --serial emulator-5554 --expected-api ${{ matrix.api }} --expected-page-size 4096
          --apk android/core/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          --inventory docs/contracts/pin-free-local-access-device-tests-v1.json --exact-inventory
          --receipt "${RUNNER_TEMP}/owner-alpha-pilot/persistence.json"
      - name: Publish content-free synthetic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-alpha-pilot-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/owner-alpha-pilot/*.json
            ${{ runner.temp }}/owner-alpha-pilot-artifact.json
            ${{ runner.temp }}/owner-alpha-pilot/persistence-diagnostics/*.json*
          retention-days: 7
          if-no-files-found: error
