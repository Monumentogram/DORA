name: Verify permanent local Whisper model
on:
  push:
    branches: ["stage/9-permanent-whisper-model"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: permanent-whisper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: {cache-provider: basic, validate-wrappers: true}
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Run focused pinned-model store tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:testDebugUnitTest --tests "com.monumentogram.dora.transcript.PinnedModelStoreTest"
