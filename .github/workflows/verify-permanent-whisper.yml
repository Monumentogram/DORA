name: Verify permanent local Whisper model
on:
  push:
    branches: ["stage/9-permanent-whisper-model"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: permanent-whisper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with: {cache-provider: basic, validate-wrappers: true}
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Run Android formatting, analysis, unit and build gates
        working-directory: android
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          spotlessCheck detekt
          :app:testDebugUnitTest :core:audio:testDebugUnitTest
          :core:model:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: permanent-whisper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
