name: Stage 0 host oracles

on:
  pull_request:
    branches:
      - main
      - codex/poc-offline-i1-oracle-scope
    paths:
      - .github/workflows/stage0-host-oracles.yml
      - docs/evidence/poc-battery-001/capture-only-controlled-comparator-host-oracle-local-evidence-stage0-v0.1.json
      - docs/evidence/poc-data-001/synthetic-public-manifest-validator-local-evidence-stage0-v0.1.json
      - docs/evidence/poc-decision-001/decision-revision-projection-host-oracle-local-evidence-stage0-v0.1.json
      - docs/evidence/poc-offline-001/i1-host-oracle-implementation-evidence-stage0-v0.1.json
      - docs/evidence/poc-offline-001/i1-host-oracle-scope-stage0-v0.1.json
      - docs/evidence/poc-offline-001/i1-resource-envelope-amendment-stage0-v0.3.json
      - docs/evidence/poc-offline-001/readiness-contract-stage0-v0.1.json
      - docs/evidence/poc-offline-001/i1-semantics-and-implementation-scope-stage0-v0.2.json
      - docs/evidence/poc-offline-001/reviews/off-i1-resource-envelope-003.external-review.json
      - docs/evidence/poc-offline-001/reviews/off-i1-semantics-scope-002.external-review.json
      - docs/evidence/poc-vad-001/p2-host-oracle-local-evidence-stage0-v0.1.json
      - docs/stage0/DORA_MVP1_POC_OFFLINE_I1_RESOURCE_ENVELOPE_AMENDMENT_STAGE0_V0_3.md
      - docs/stage0/DORA_MVP1_POC_OFFLINE_I1_HOST_ORACLE_SCOPE_STAGE0_V0_1.md
      - docs/stage0/DORA_MVP1_POC_OFFLINE_I1_SEMANTICS_AND_IMPLEMENTATION_SCOPE_STAGE0_V0_2.md
      - docs/stage0/DORA_MVP1_POC_OFFLINE_READINESS_CONTRACT_STAGE0_V0_1.md
      - docs/stage0/poc-data-synthetic-public-projection-stage0-v0.1.schema.json
      - tools/battery_campaign_oracle/src/main/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracle.java
      - tools/battery_campaign_oracle/src/test/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracleTest.java
      - tools/decision_revision_oracle/src/main/java/com/monumentogram/dora/stage0/decision/DecisionRevisionOracle.java
      - tools/decision_revision_oracle/src/test/java/com/monumentogram/dora/stage0/decision/DecisionRevisionOracleTest.java
      - tools/offline_i1_oracle/src/main/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1Oracle.java
      - tools/offline_i1_oracle/src/test/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1OracleTest.java
      - tools/poc_data_manifest_validator/src/main/java/com/monumentogram/dora/stage0/data/manifest/SyntheticManifestValidator.java
      - tools/poc_data_manifest_validator/src/test/java/com/monumentogram/dora/stage0/data/manifest/SyntheticManifestValidatorTest.java
      - tools/vad_p2_oracle/src/main/java/com/monumentogram/dora/stage0/vad/p2/VadBoundaryOracle.java
      - tools/vad_p2_oracle/src/test/java/com/monumentogram/dora/stage0/vad/p2/VadBoundaryOracleTest.java

permissions:
  contents: read

concurrency:
  group: stage0-host-oracles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_IMAGE_OS: ubuntu24
  EXPECTED_IMAGE_VERSION: 20260810.271.1
  EXPECTED_JAVA_VERSION: 17.0.20
  EXPECTED_JAVA_BUILD: "17.0.20+8"
  EXPECTED_JAVA_RELEASE_DATE: "2026-07-21"
  EXPECTED_JAVA_SHA256: 6dce8306ebf735a85decdc801d84431f6e84525b60adc885624df05edeffb481
  EXPECTED_JAVAC_SHA256: a05c6a23a79c688d2f395a25e456c81749dc0f720aeea21c29ea44f6e27f3bfc
  EXPECTED_JDEPS_SHA256: 8333a54439b0b25bec29bfabd0c81de51d06536d778866671031cd2616c7bd1f
  EXPECTED_JAVAP_SHA256: 1f4a366f20ec1442232c242adeb03a597e20d2383f9ab59be02ab5c472c3136c
  EXPECTED_JDK_RELEASE_SHA256: 9bba1dfe6fa144a9ed37833b4b3443ab803c41618612b772bdc7330027469346
  EXPECTED_GREP_PATH: /usr/bin/grep
  EXPECTED_GREP_VERSION: "grep (GNU grep) 3.11"
  EXPECTED_GREP_SHA256: 20a35a4c18f2fe9e6305c1cbf866b9c0fcc3f957132ae66028c99ec353bb0a80

jobs:
  authorized-scope:
    name: stage0-host-authorized-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require an exact authorized head branch
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "${HEAD_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          case "${GITHUB_HEAD_REF}" in
            codex/poc-battery-campaign-oracle | \
            codex/poc-vad-p2-host-oracle | \
            codex/poc-decision-revision-oracle | \
            codex/poc-data-manifest-validator)
              [[ "${BASE_REF}" == "main" ]]
              [[ "${BASE_SHA}" == "78e9dd07d616989987118f26bb16ebb9932ddb2b" ]]
              ;;
            codex/poc-offline-i1-semantics-v02)
              [[ "${BASE_REF}" == "main" ]]
              [[ "${BASE_SHA}" == "a3ccae7b1da1f42132a46f1a96b26fc43f680b80" ]]
              ;;
            *)
              echo "::error::Unauthorized Stage 0 host-oracle head: ${GITHUB_HEAD_REF}"
              exit 1
              ;;
          esac

      - name: Check out the exact pull-request head and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact authorized pull-request file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t actual < <(git diff --name-only --diff-filter=ACDMRTUXB "${BASE_SHA}...${HEAD_SHA}" | LC_ALL=C sort)
          case "${GITHUB_HEAD_REF}" in
            codex/poc-battery-campaign-oracle)
              expected=(
                .github/workflows/stage0-host-oracles.yml
                docs/evidence/poc-battery-001/capture-only-controlled-comparator-host-oracle-local-evidence-stage0-v0.1.json
                tools/battery_campaign_oracle/src/main/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracle.java
                tools/battery_campaign_oracle/src/test/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracleTest.java
              )
              ;;
            codex/poc-vad-p2-host-oracle)
              expected=(
                .github/workflows/stage0-host-oracles.yml
                docs/evidence/poc-vad-001/p2-host-oracle-local-evidence-stage0-v0.1.json
                tools/vad_p2_oracle/src/main/java/com/monumentogram/dora/stage0/vad/p2/VadBoundaryOracle.java
                tools/vad_p2_oracle/src/test/java/com/monumentogram/dora/stage0/vad/p2/VadBoundaryOracleTest.java
              )
              ;;
            codex/poc-decision-revision-oracle)
              expected=(
                .github/workflows/stage0-host-oracles.yml
                docs/evidence/poc-decision-001/decision-revision-projection-host-oracle-local-evidence-stage0-v0.1.json
                tools/decision_revision_oracle/src/main/java/com/monumentogram/dora/stage0/decision/DecisionRevisionOracle.java
                tools/decision_revision_oracle/src/test/java/com/monumentogram/dora/stage0/decision/DecisionRevisionOracleTest.java
              )
              ;;
            codex/poc-data-manifest-validator)
              expected=(
                .github/workflows/stage0-host-oracles.yml
                docs/evidence/poc-data-001/synthetic-public-manifest-validator-local-evidence-stage0-v0.1.json
                docs/stage0/poc-data-synthetic-public-projection-stage0-v0.1.schema.json
                tools/poc_data_manifest_validator/src/main/java/com/monumentogram/dora/stage0/data/manifest/SyntheticManifestValidator.java
                tools/poc_data_manifest_validator/src/test/java/com/monumentogram/dora/stage0/data/manifest/SyntheticManifestValidatorTest.java
              )
              ;;
            codex/poc-offline-i1-semantics-v02)
              expected=(
                .github/workflows/stage0-host-oracles.yml
                docs/evidence/poc-offline-001/i1-host-oracle-implementation-evidence-stage0-v0.1.json
                docs/evidence/poc-offline-001/i1-resource-envelope-amendment-stage0-v0.3.json
                docs/evidence/poc-offline-001/i1-semantics-and-implementation-scope-stage0-v0.2.json
                docs/evidence/poc-offline-001/reviews/off-i1-resource-envelope-003.external-review.json
                docs/evidence/poc-offline-001/reviews/off-i1-semantics-scope-002.external-review.json
                docs/stage0/DORA_MVP1_POC_OFFLINE_I1_RESOURCE_ENVELOPE_AMENDMENT_STAGE0_V0_3.md
                docs/stage0/DORA_MVP1_POC_OFFLINE_I1_SEMANTICS_AND_IMPLEMENTATION_SCOPE_STAGE0_V0_2.md
                tools/offline_i1_oracle/src/main/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1Oracle.java
                tools/offline_i1_oracle/src/test/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1OracleTest.java
              )
              ;;
            *)
              exit 1
              ;;
          esac
          [[ "${#actual[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${actual[index]}" == "${expected[index]}" ]]
          done
          [[ -z "$(git status --porcelain)" ]]

  stage0-host-battery:
    name: stage0-host-battery
    if: ${{ github.head_ref == 'codex/poc-battery-campaign-oracle' }}
    needs: authorized-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the pinned runner and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          [[ "${ImageOS:-}" == "${EXPECTED_IMAGE_OS}" ]]
          [[ "${ImageVersion:-}" == "${EXPECTED_IMAGE_VERSION}" ]]
          [[ -x "${JAVA_HOME_17_X64}/bin/java" ]]
          [[ "$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/javac" -version 2>&1)" == "javac ${EXPECTED_JAVA_VERSION}" ]]
          java_version="$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/java" -version 2>&1)"
          printf '%s\n' "${java_version}"
          mapfile -t java_version_lines <<<"${java_version}"
          [[ "${#java_version_lines[@]}" -eq 3 ]]
          [[ "${java_version_lines[0]}" == "openjdk version \"${EXPECTED_JAVA_VERSION}\" ${EXPECTED_JAVA_RELEASE_DATE}" ]]
          [[ "${java_version_lines[1]}" == "OpenJDK Runtime Environment Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD})" ]]
          [[ "${java_version_lines[2]}" == "OpenJDK 64-Bit Server VM Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD}, mixed mode, sharing)" ]]
          sha256sum \
            "${JAVA_HOME_17_X64}/bin/java" \
            "${JAVA_HOME_17_X64}/bin/javac" \
            "${JAVA_HOME_17_X64}/bin/jdeps" \
            "${JAVA_HOME_17_X64}/bin/javap" \
            "${JAVA_HOME_17_X64}/release"
          grep_path="$(PATH="/usr/bin:/bin" command -v grep)"
          [[ "${grep_path}" == "${EXPECTED_GREP_PATH}" && -x "${grep_path}" ]]
          grep_version="$("${clean_env[@]}" "${grep_path}" --version)"
          printf '%s\n' "${grep_version}"
          mapfile -t grep_version_lines <<<"${grep_version}"
          [[ "${grep_version_lines[0]}" == "${EXPECTED_GREP_VERSION}" ]]
          "${clean_env[@]}" /usr/bin/sha256sum --check --strict - <<SHA256
          ${EXPECTED_JAVA_SHA256}  ${JAVA_HOME_17_X64}/bin/java
          ${EXPECTED_JAVAC_SHA256}  ${JAVA_HOME_17_X64}/bin/javac
          ${EXPECTED_JDEPS_SHA256}  ${JAVA_HOME_17_X64}/bin/jdeps
          ${EXPECTED_JAVAP_SHA256}  ${JAVA_HOME_17_X64}/bin/javap
          ${EXPECTED_JDK_RELEASE_SHA256}  ${JAVA_HOME_17_X64}/release
          ${EXPECTED_GREP_SHA256}  ${grep_path}
          SHA256
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Verify the exact POC-BATTERY-001 host oracle
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          java_bin="${JAVA_HOME_17_X64}/bin/java"
          javac_bin="${JAVA_HOME_17_X64}/bin/javac"
          jdeps_bin="${JAVA_HOME_17_X64}/bin/jdeps"
          javap_bin="${JAVA_HOME_17_X64}/bin/javap"
          grep_bin="${EXPECTED_GREP_PATH}"
          [[ "${grep_bin}" == /* && -x "${grep_bin}" ]]
          main_source="tools/battery_campaign_oracle/src/main/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracle.java"
          test_source="tools/battery_campaign_oracle/src/test/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracleTest.java"

          sha256sum --check --strict <<'SHA256'
          354b607a0ad7a5aa7a4243dee34d3bb8d93bdaeacfa9a8374ae69207d4fe1883  tools/battery_campaign_oracle/src/main/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracle.java
          6868d63cda474cafc8661ccc01e25809467b4580988af33d042687604f7b5f30  tools/battery_campaign_oracle/src/test/java/com/monumentogram/dora/stage0/battery/BatteryCampaignOracleTest.java
          21358153669e1ffc4a6b6ec398fb683b0d326debd4830b61edc7fcb21782844e  docs/evidence/poc-battery-001/capture-only-controlled-comparator-host-oracle-local-evidence-stage0-v0.1.json
          SHA256

          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          slice_tmp="$(mktemp -d -- "${runner_temp}/dora-battery-ci.XXXXXX")"
          cleanup() {
            if [[ -n "${slice_tmp:-}" && "${slice_tmp}" == "${runner_temp}"/dora-battery-ci.* ]]; then
              rm -rf -- "${slice_tmp}"
            fi
          }
          trap cleanup EXIT
          slice_tmp="$(realpath -e -- "${slice_tmp}")"
          [[ "${slice_tmp}" == "${runner_temp}"/dora-battery-ci.* ]]
          [[ "${slice_tmp}" != "${workspace}" && "${slice_tmp}" != "${workspace}"/* ]]
          mkdir -p "${slice_tmp}/classes"

          "${clean_env[@]}" "${javac_bin}" -encoding UTF-8 --release 17 -Xlint:all -Werror \
            -d "${slice_tmp}/classes" "${main_source}" "${test_source}" \
            >"${slice_tmp}/compile.stdout" 2>"${slice_tmp}/compile.stderr"
          [[ ! -s "${slice_tmp}/compile.stdout" && ! -s "${slice_tmp}/compile.stderr" ]]

          test_class="com.monumentogram.dora.stage0.battery.BatteryCampaignOracleTest"
          "${clean_env[@]}" "${java_bin}" -cp "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/primary-1.stdout" 2>"${slice_tmp}/primary-1.stderr"
          "${clean_env[@]}" "${java_bin}" -cp "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/primary-2.stdout" 2>"${slice_tmp}/primary-2.stderr"
          "${clean_env[@]}" "${java_bin}" -ea -Xverify:all -cp "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/verify.stdout" 2>"${slice_tmp}/verify.stderr"
          printf '%s' 'BATTERY_CAMPAIGN_ORACLE_TEST_OK' >"${slice_tmp}/expected.stdout"
          cmp "${slice_tmp}/expected.stdout" "${slice_tmp}/primary-1.stdout"
          cmp "${slice_tmp}/primary-1.stdout" "${slice_tmp}/primary-2.stdout"
          cmp "${slice_tmp}/primary-1.stdout" "${slice_tmp}/verify.stdout"
          [[ ! -s "${slice_tmp}/primary-1.stderr" ]]
          [[ ! -s "${slice_tmp}/primary-2.stderr" ]]
          [[ ! -s "${slice_tmp}/verify.stderr" ]]

          printf '%s\n' 'java.base' >"${slice_tmp}/expected-jdeps.stdout"
          "${clean_env[@]}" "${jdeps_bin}" --multi-release 17 --recursive --print-module-deps \
            "${slice_tmp}/classes" >"${slice_tmp}/jdeps.stdout" 2>"${slice_tmp}/jdeps.stderr"
          cmp "${slice_tmp}/expected-jdeps.stdout" "${slice_tmp}/jdeps.stdout"
          [[ ! -s "${slice_tmp}/jdeps.stderr" ]]
          "${clean_env[@]}" "${javap_bin}" -verbose -classpath "${slice_tmp}/classes" \
            com.monumentogram.dora.stage0.battery.BatteryCampaignOracle \
            >"${slice_tmp}/javap-main.stdout" 2>"${slice_tmp}/javap-main.stderr"
          "${clean_env[@]}" "${javap_bin}" -verbose -classpath "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/javap-test.stdout" 2>"${slice_tmp}/javap-test.stderr"
          [[ ! -s "${slice_tmp}/javap-main.stderr" && ! -s "${slice_tmp}/javap-test.stderr" ]]
          [[ "$("${clean_env[@]}" "${grep_bin}" -Ec '^[[:space:]]*major version: 61$' "${slice_tmp}/javap-main.stdout")" == "1" ]]
          [[ "$("${clean_env[@]}" "${grep_bin}" -Ec '^[[:space:]]*major version: 61$' "${slice_tmp}/javap-test.stdout")" == "1" ]]

          forbidden='java\.(io|net|nio\.file)|System\.(getenv|getProperty|currentTimeMillis|nanoTime)|Instant\.now|Clock\.|LocalDateTime\.now|ZonedDateTime\.now|OffsetDateTime\.now|\bRandom\b|Thread\.|\bProcessBuilder\b|Runtime\.getRuntime|Executors\.|ForkJoinPool'
          if "${clean_env[@]}" "${grep_bin}" --line-number --with-filename --color=never --extended-regexp -- "${forbidden}" "${main_source}" "${test_source}"; then
            echo "::error::Forbidden API token found in POC-BATTERY-001"
            exit 1
          else
            scan_status=$?
            [[ "${scan_status}" -eq 1 ]]
          fi

          [[ -z "$(find . -path ./.git -prune -o -type f -name '*.class' -print -quit)" ]]
          [[ -z "$(git status --porcelain)" ]]
          cleanup
          [[ ! -e "${slice_tmp}" ]]
          trap - EXIT
          printf '%s\n' 'PINNED_TOOLCHAIN_HOST_REVALIDATION_OK POC-BATTERY-001'

  stage0-host-vad-p2:
    name: stage0-host-vad-p2
    if: ${{ github.head_ref == 'codex/poc-vad-p2-host-oracle' }}
    needs: authorized-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the pinned runner and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          [[ "${ImageOS:-}" == "${EXPECTED_IMAGE_OS}" ]]
          [[ "${ImageVersion:-}" == "${EXPECTED_IMAGE_VERSION}" ]]
          [[ -x "${JAVA_HOME_17_X64}/bin/java" ]]
          [[ "$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/javac" -version 2>&1)" == "javac ${EXPECTED_JAVA_VERSION}" ]]
          java_version="$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/java" -version 2>&1)"
          printf '%s\n' "${java_version}"
          mapfile -t java_version_lines <<<"${java_version}"
          [[ "${#java_version_lines[@]}" -eq 3 ]]
          [[ "${java_version_lines[0]}" == "openjdk version \"${EXPECTED_JAVA_VERSION}\" ${EXPECTED_JAVA_RELEASE_DATE}" ]]
          [[ "${java_version_lines[1]}" == "OpenJDK Runtime Environment Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD})" ]]
          [[ "${java_version_lines[2]}" == "OpenJDK 64-Bit Server VM Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD}, mixed mode, sharing)" ]]
          sha256sum "${JAVA_HOME_17_X64}/bin/java" "${JAVA_HOME_17_X64}/bin/javac" \
            "${JAVA_HOME_17_X64}/bin/jdeps" "${JAVA_HOME_17_X64}/bin/javap" "${JAVA_HOME_17_X64}/release"
          grep_path="$(PATH="/usr/bin:/bin" command -v grep)"
          [[ "${grep_path}" == "${EXPECTED_GREP_PATH}" && -x "${grep_path}" ]]
          grep_version="$("${clean_env[@]}" "${grep_path}" --version)"
          printf '%s\n' "${grep_version}"
          mapfile -t grep_version_lines <<<"${grep_version}"
          [[ "${grep_version_lines[0]}" == "${EXPECTED_GREP_VERSION}" ]]
          "${clean_env[@]}" /usr/bin/sha256sum --check --strict - <<SHA256
          ${EXPECTED_JAVA_SHA256}  ${JAVA_HOME_17_X64}/bin/java
          ${EXPECTED_JAVAC_SHA256}  ${JAVA_HOME_17_X64}/bin/javac
          ${EXPECTED_JDEPS_SHA256}  ${JAVA_HOME_17_X64}/bin/jdeps
          ${EXPECTED_JAVAP_SHA256}  ${JAVA_HOME_17_X64}/bin/javap
          ${EXPECTED_JDK_RELEASE_SHA256}  ${JAVA_HOME_17_X64}/release
          ${EXPECTED_GREP_SHA256}  ${grep_path}
          SHA256
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Verify the exact POC-VAD-001 P2 host oracle
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          java_bin="${JAVA_HOME_17_X64}/bin/java"
          javac_bin="${JAVA_HOME_17_X64}/bin/javac"
          jdeps_bin="${JAVA_HOME_17_X64}/bin/jdeps"
          javap_bin="${JAVA_HOME_17_X64}/bin/javap"
          grep_bin="${EXPECTED_GREP_PATH}"
          [[ "${grep_bin}" == /* && -x "${grep_bin}" ]]
          main_source="tools/vad_p2_oracle/src/main/java/com/monumentogram/dora/stage0/vad/p2/VadBoundaryOracle.java"
