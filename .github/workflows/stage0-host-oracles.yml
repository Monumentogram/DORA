          [[ "${OBSERVED_BASE_SHA}" == "a3ccae7b1da1f42132a46f1a96b26fc43f680b80" ]]

      - name: Verify the pinned runner and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          [[ "${ImageOS:-}" == "${EXPECTED_IMAGE_OS}" ]]
          [[ "${ImageVersion:-}" == "${EXPECTED_IMAGE_VERSION}" ]]
          [[ "$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/javac" -version 2>&1)" == "javac ${EXPECTED_JAVA_VERSION}" ]]
          java_version="$("${clean_env[@]}" "${JAVA_HOME_17_X64}/bin/java" -version 2>&1)"
          printf '%s\n' "${java_version}"
          mapfile -t java_version_lines <<<"${java_version}"
          [[ "${#java_version_lines[@]}" -eq 3 ]]
          [[ "${java_version_lines[0]}" == "openjdk version \"${EXPECTED_JAVA_VERSION}\" ${EXPECTED_JAVA_RELEASE_DATE}" ]]
          [[ "${java_version_lines[1]}" == "OpenJDK Runtime Environment Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD})" ]]
          [[ "${java_version_lines[2]}" == "OpenJDK 64-Bit Server VM Temurin-${EXPECTED_JAVA_BUILD} (build ${EXPECTED_JAVA_BUILD}, mixed mode, sharing)" ]]
          sha256sum "${JAVA_HOME_17_X64}/bin/java" "${JAVA_HOME_17_X64}/bin/javac" \
            "${JAVA_HOME_17_X64}/bin/jdeps" "${JAVA_HOME_17_X64}/bin/javap" "${JAVA_HOME_17_X64}/release"
          grep_path="$(PATH="/usr/bin:/bin" command -v grep)"
          [[ "${grep_path}" == "${EXPECTED_GREP_PATH}" && -x "${grep_path}" ]]
          grep_version="$("${clean_env[@]}" "${grep_path}" --version)"
          printf '%s\n' "${grep_version}"
          mapfile -t grep_version_lines <<<"${grep_version}"
          [[ "${grep_version_lines[0]}" == "${EXPECTED_GREP_VERSION}" ]]
          "${clean_env[@]}" /usr/bin/sha256sum --check --strict - <<SHA256
          ${EXPECTED_JAVA_SHA256}  ${JAVA_HOME_17_X64}/bin/java
          ${EXPECTED_JAVAC_SHA256}  ${JAVA_HOME_17_X64}/bin/javac
          ${EXPECTED_JDEPS_SHA256}  ${JAVA_HOME_17_X64}/bin/jdeps
          ${EXPECTED_JAVAP_SHA256}  ${JAVA_HOME_17_X64}/bin/javap
          ${EXPECTED_JDK_RELEASE_SHA256}  ${JAVA_HOME_17_X64}/release
          ${EXPECTED_GREP_SHA256}  ${grep_path}
          SHA256
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Verify the exact POC-OFFLINE-001 I1 host oracle
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          clean_env=(env -i PATH="${JAVA_HOME_17_X64}/bin:/usr/bin:/bin")
          java_bin="${JAVA_HOME_17_X64}/bin/java"
          javac_bin="${JAVA_HOME_17_X64}/bin/javac"
          jdeps_bin="${JAVA_HOME_17_X64}/bin/jdeps"
          javap_bin="${JAVA_HOME_17_X64}/bin/javap"
          grep_bin="${EXPECTED_GREP_PATH}"
          [[ "${grep_bin}" == /* && -x "${grep_bin}" ]]
          main_source="tools/offline_i1_oracle/src/main/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1Oracle.java"
          test_source="tools/offline_i1_oracle/src/test/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1OracleTest.java"

          sha256sum --check --strict <<'SHA256'
          27168571abe76fc76e958ca984217b5ff58f6433d7790e36a72d065815de876d  docs/evidence/poc-offline-001/i1-host-oracle-implementation-evidence-stage0-v0.1.json
          83075ca723f007b1f282fe0e089a7725a68d8bcf69ebb084f0f1a44704fb97b7  docs/evidence/poc-offline-001/i1-host-oracle-scope-stage0-v0.1.json
          6972a5df028f64664c4f411cedb87f3db2a7a2e1d8ae982ae707bd2ca3e7f46f  docs/evidence/poc-offline-001/i1-resource-envelope-amendment-stage0-v0.3.json
          a564cf9031f610006327c374baff82983de2ea9ba4b6c9d13d6185e7967a6dae  docs/evidence/poc-offline-001/readiness-contract-stage0-v0.1.json
          156915ba88f97e9bbf08da02b6ef4c2b475c173f1f9b96e8c70fe50e2a174785  docs/evidence/poc-offline-001/i1-semantics-and-implementation-scope-stage0-v0.2.json
          b58d0d5abe643122f7b06ae7fa4de55d2724876ab655c88ee49b874d91c6efee  docs/evidence/poc-offline-001/reviews/off-i1-resource-envelope-003.external-review.json
          c2a9f86f6d73a7b2f58fe7980691c07f4c9acca7e87fe517655604011db82f17  docs/evidence/poc-offline-001/reviews/off-i1-semantics-scope-002.external-review.json
          d28faad79faa740c8dc54095c9bd8cc9ad9d59de592261784eaea3e2eb1de2a0  docs/stage0/DORA_MVP1_POC_OFFLINE_I1_RESOURCE_ENVELOPE_AMENDMENT_STAGE0_V0_3.md
          f3134d5e97fc8c728b31260a056d3d916e523a5a34256bee2dd89d486292f4f2  docs/stage0/DORA_MVP1_POC_OFFLINE_I1_HOST_ORACLE_SCOPE_STAGE0_V0_1.md
          64a8cd6c7230b104834ca8bdb8a8a3a1c1525277dc8b913487acf2739e67c08e  docs/stage0/DORA_MVP1_POC_OFFLINE_I1_SEMANTICS_AND_IMPLEMENTATION_SCOPE_STAGE0_V0_2.md
          9a905eabbcd75601fc598cccc001dcff56a5b6b65eeb936f2a9c4602d658682a  docs/stage0/DORA_MVP1_POC_OFFLINE_READINESS_CONTRACT_STAGE0_V0_1.md
          2eb3a80716fdc25abe7300552c8ba95f4deabe68e7c8d5d42dcf9d5cb13235bf  tools/offline_i1_oracle/src/main/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1Oracle.java
          235be2b6d3c646ce9c0910369de99847a149d226159ab1f8a1785e074572b89c  tools/offline_i1_oracle/src/test/java/com/monumentogram/dora/stage0/offline/i1/OfflineI1OracleTest.java
          SHA256

          runner_temp="$(realpath -e -- "${RUNNER_TEMP}")"
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE}")"
          slice_tmp="$(mktemp -d -- "${runner_temp}/dora-offline-i1-ci.XXXXXX")"
          cleanup() {
            if [[ -n "${slice_tmp:-}" && "${slice_tmp}" == "${runner_temp}"/dora-offline-i1-ci.* ]]; then
              rm -rf -- "${slice_tmp}"
            fi
          }
          trap cleanup EXIT
          slice_tmp="$(realpath -e -- "${slice_tmp}")"
          [[ "${slice_tmp}" == "${runner_temp}"/dora-offline-i1-ci.* ]]
          [[ "${slice_tmp}" != "${workspace}" && "${slice_tmp}" != "${workspace}"/* ]]
          mkdir -p "${slice_tmp}/classes" "${slice_tmp}/strict-classes"
          "${clean_env[@]}" "${javac_bin}" -encoding UTF-8 --release 17 \
            -d "${slice_tmp}/classes" "${main_source}" "${test_source}" \
            >"${slice_tmp}/compile.stdout" 2>"${slice_tmp}/compile.stderr"
          [[ ! -s "${slice_tmp}/compile.stdout" && ! -s "${slice_tmp}/compile.stderr" ]]

          test_class="com.monumentogram.dora.stage0.offline.i1.OfflineI1OracleTest"
          "${clean_env[@]}" "${java_bin}" -cp "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/primary-1.stdout" 2>"${slice_tmp}/primary-1.stderr"
          "${clean_env[@]}" "${java_bin}" -cp "${slice_tmp}/classes" "${test_class}" \
            >"${slice_tmp}/primary-2.stdout" 2>"${slice_tmp}/primary-2.stderr"
          printf '%s' 'PASS offline-i1-host-oracle' >"${slice_tmp}/expected.stdout"
          cmp "${slice_tmp}/expected.stdout" "${slice_tmp}/primary-1.stdout"
          cmp "${slice_tmp}/primary-1.stdout" "${slice_tmp}/primary-2.stdout"
          [[ ! -s "${slice_tmp}/primary-1.stderr" && ! -s "${slice_tmp}/primary-2.stderr" ]]

          "${clean_env[@]}" "${javac_bin}" -encoding UTF-8 --release 17 -Xlint:all -Werror \
            -d "${slice_tmp}/strict-classes" "${main_source}" "${test_source}" \
            >"${slice_tmp}/strict-compile.stdout" 2>"${slice_tmp}/strict-compile.stderr"
          [[ ! -s "${slice_tmp}/strict-compile.stdout" && ! -s "${slice_tmp}/strict-compile.stderr" ]]
          "${clean_env[@]}" "${java_bin}" -ea -Xverify:all -cp "${slice_tmp}/strict-classes" "${test_class}" \
            >"${slice_tmp}/verify.stdout" 2>"${slice_tmp}/verify.stderr"
          cmp "${slice_tmp}/expected.stdout" "${slice_tmp}/verify.stdout"
          [[ ! -s "${slice_tmp}/verify.stderr" ]]
          printf '%s\n' 'java.base' >"${slice_tmp}/expected-jdeps.stdout"
          "${clean_env[@]}" "${jdeps_bin}" --multi-release 17 --recursive --print-module-deps \
            "${slice_tmp}/strict-classes" >"${slice_tmp}/jdeps.stdout" 2>"${slice_tmp}/jdeps.stderr"
          cmp "${slice_tmp}/expected-jdeps.stdout" "${slice_tmp}/jdeps.stdout"
          [[ ! -s "${slice_tmp}/jdeps.stderr" ]]
          "${clean_env[@]}" "${javap_bin}" -verbose -classpath "${slice_tmp}/strict-classes" \
            com.monumentogram.dora.stage0.offline.i1.OfflineI1Oracle \
            >"${slice_tmp}/javap.stdout" 2>"${slice_tmp}/javap.stderr"
          [[ ! -s "${slice_tmp}/javap.stderr" ]]
          [[ "$("${clean_env[@]}" "${grep_bin}" -Ec '^[[:space:]]*major version: 61$' "${slice_tmp}/javap.stdout")" == "1" ]]

          forbidden='java\.(io|net|nio\.file)|System\.(getenv|getProperty|currentTimeMillis|nanoTime)|Instant\.now|Clock\.|LocalDateTime\.now|ZonedDateTime\.now|OffsetDateTime\.now|\bRandom\b|Thread\.|\bProcessBuilder\b|Runtime\.getRuntime|Executors\.|ForkJoinPool'
          if "${clean_env[@]}" "${grep_bin}" --line-number --with-filename --color=never --extended-regexp -- "${forbidden}" "${main_source}"; then
            echo "::error::Forbidden API token found in POC-OFFLINE-001"
            exit 1
          else
            scan_status=$?
            [[ "${scan_status}" -eq 1 ]]
          fi
          if "${clean_env[@]}" "${grep_bin}" --line-number --with-filename --color=never --extended-regexp -- 'System\.(out|err)' "${main_source}"; then
            echo "::error::Main oracle writes stdout or stderr"
            exit 1
          else
            scan_status=$?
            [[ "${scan_status}" -eq 1 ]]
          fi
          "${clean_env[@]}" "${javap_bin}" -public -classpath "${slice_tmp}/strict-classes" \
            com.monumentogram.dora.stage0.offline.i1.OfflineI1Oracle \
            >"${slice_tmp}/public-api.txt" 2>"${slice_tmp}/public-api.stderr"
          [[ ! -s "${slice_tmp}/public-api.stderr" ]]
          if "${clean_env[@]}" "${grep_bin}" --line-number --with-filename --color=never --extended-regexp -- 'java\.(io|net|nio\.file)|Process|Thread|Executor|Random' "${slice_tmp}/public-api.txt"; then
            echo "::error::Forbidden public API surface found"
            exit 1
          else
            scan_status=$?
            [[ "${scan_status}" -eq 1 ]]
          fi
          [[ -z "$(find . -path ./.git -prune -o -type f -name '*.class' -print -quit)" ]]
          [[ -z "$(git status --porcelain)" ]]
          cleanup
          [[ ! -e "${slice_tmp}" ]]
          trap - EXIT
          printf '%s\n' 'PINNED_TOOLCHAIN_HOST_REVALIDATION_OK POC-OFFLINE-001 I1'

  stage0-host-advisory:
    name: stage0-host-advisory
    if: ${{ always() }}
    needs:
      - authorized-scope
      - stage0-host-battery
      - stage0-host-vad-p2
      - stage0-host-decision
      - stage0-host-data
      - stage0-host-offline-i1
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require the selected package job and only that job to pass
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          SCOPE_RESULT: ${{ needs['authorized-scope'].result }}
          BATTERY_RESULT: ${{ needs['stage0-host-battery'].result }}
          VAD_RESULT: ${{ needs['stage0-host-vad-p2'].result }}
          DECISION_RESULT: ${{ needs['stage0-host-decision'].result }}
          DATA_RESULT: ${{ needs['stage0-host-data'].result }}
          OFFLINE_RESULT: ${{ needs['stage0-host-offline-i1'].result }}
        run: |
          set -euo pipefail
          [[ "${SCOPE_RESULT}" == "success" ]]
          case "${HEAD_BRANCH}" in
            codex/poc-battery-campaign-oracle)
              [[ "${BATTERY_RESULT}" == "success" ]]
              [[ "${VAD_RESULT}" == "skipped" && "${DECISION_RESULT}" == "skipped" ]]
              [[ "${DATA_RESULT}" == "skipped" && "${OFFLINE_RESULT}" == "skipped" ]]
              ;;
            codex/poc-vad-p2-host-oracle)
              [[ "${VAD_RESULT}" == "success" ]]
              [[ "${BATTERY_RESULT}" == "skipped" && "${DECISION_RESULT}" == "skipped" ]]
              [[ "${DATA_RESULT}" == "skipped" && "${OFFLINE_RESULT}" == "skipped" ]]
              ;;
            codex/poc-decision-revision-oracle)
              [[ "${DECISION_RESULT}" == "success" ]]
              [[ "${BATTERY_RESULT}" == "skipped" && "${VAD_RESULT}" == "skipped" ]]
              [[ "${DATA_RESULT}" == "skipped" && "${OFFLINE_RESULT}" == "skipped" ]]
              ;;
            codex/poc-data-manifest-validator)
              [[ "${DATA_RESULT}" == "success" ]]
              [[ "${BATTERY_RESULT}" == "skipped" && "${VAD_RESULT}" == "skipped" ]]
              [[ "${DECISION_RESULT}" == "skipped" && "${OFFLINE_RESULT}" == "skipped" ]]
              ;;
            codex/poc-offline-i1-semantics-v02)
              [[ "${OFFLINE_RESULT}" == "success" ]]
              [[ "${BATTERY_RESULT}" == "skipped" && "${VAD_RESULT}" == "skipped" ]]
              [[ "${DECISION_RESULT}" == "skipped" && "${DATA_RESULT}" == "skipped" ]]
              ;;
            *)
              exit 1
              ;;
          esac
          printf '%s\n' "STAGE0_HOST_ADVISORY_CHECK_OK ${HEAD_BRANCH}"
