name: Android CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    name: android-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable baseline is present
        run: git cat-file -e '1be83e2940a09f7b23e33b4cdf3827de2690f3fd^{commit}'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android SDK 36
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Validate Stage 00 artifacts
        run: python3 tools/validate_stage00.py

      - name: Validate isolated capture PoC contracts
        run: python3 tools/validate_poc_capture.py

      - name: Validate isolated search PoC contracts
        run: python3 tools/validate_poc_search.py

      - name: Check formatting and Kotlin static analysis
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          spotlessCheck
          detekt

      - name: Unit tests, instrumentation compilation, lint, and debug assembly
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :core:common:testDebugUnitTest
          :core:model:testDebugUnitTest
          :core:testing:testDebugUnitTest
          :poc:capture:testDebugUnitTest
          :poc:search:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :poc:capture:compileDebugAndroidTestKotlin
          :poc:search:compileDebugAndroidTestKotlin
          :app:lintDebug
          :core:common:lintDebug
          :core:model:lintDebug
          :core:testing:lintDebug
          :poc:capture:lintDebug
          :poc:search:lintDebug
          :app:assembleDebug
          :poc:capture:assembleDebug
          :poc:search:assembleDebug

      - name: Verify locked search dependency artifact inventory
        run: python3 tools/poc_search_dependency_inventory.py --check

      - name: Verify native library admission and ELF alignment
        run: >-
          python3 tools/verify_apk_native_alignment.py
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify capture PoC native library admission and ELF alignment
        run: >-
          python3 tools/verify_apk_native_alignment.py
          android/poc/capture/build/outputs/apk/debug/capture-debug.apk

      - name: Verify 16 KiB APK zip alignment
        run: >-
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify capture PoC 16 KiB APK zip alignment
        run: >-
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4
          android/poc/capture/build/outputs/apk/debug/capture-debug.apk

      - name: Upload Stage 00 debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dora-stage00-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload capture PoC debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dora-poc-capture-debug-apk
          path: android/poc/capture/build/outputs/apk/debug/capture-debug.apk
          if-no-files-found: error
          retention-days: 7

  search-smoke:
    name: search-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android API 36 emulator
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools"
          "emulator"
          "platforms;android-36"
          "build-tools;36.0.0"
          "system-images;android-36;google_apis;x86_64"

      - name: Create API 36 search smoke AVD
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-smoke-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
              --force \
              --name dora_search_smoke \
              --package "system-images;android-36;google_apis;x86_64" \
              --device pixel_6

      - name: Start API 36 emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-smoke-avd
        run: |
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_search_smoke \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect -accel on -memory 2048 \
            > "${RUNNER_TEMP}/dora-search-smoke-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"
              exit 1
            fi
            boot_completed=$("${ANDROID_HOME}/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot_completed}" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"
          exit 1

      - name: Run Room FTS4 schema, correctness, safety, mapping, and mutation smoke tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :poc:search:connectedDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.monumentogram.dora.poc.search.SearchSmokeInstrumentedTest

      - name: Print emulator log on failure
        if: failure()
        run: tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"
