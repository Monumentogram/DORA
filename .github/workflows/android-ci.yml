name: Android CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    name: android-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable baseline is present
        run: git cat-file -e '1be83e2940a09f7b23e33b4cdf3827de2690f3fd^{commit}'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android SDK 36
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Validate Stage 00 artifacts
        run: python3 tools/validate_stage00.py

      - name: Verify owner-local Alpha signing boundary without secrets
        run: python3 -m unittest discover -s tools -p test_build_internal_alpha.py

      - name: Fetch pinned Recovery reviewed-source provenance
        # Squash integration does not retain the reviewed source as a HEAD ancestor.
        # Fetch its immutable object graph; the validator still verifies it fail-closed.
        run: >-
          git fetch --no-tags --no-recurse-submodules
          https://github.com/Monumentogram/DORA.git
          89551b17a84bc090ccf1cd36d48aeb59afc403fa

      - name: Validate internal Alpha release evidence and negative controls
        run: |
          python3 tools/validate_alpha_release.py
          python3 -m unittest discover -s tools -p test_validate_alpha_release.py
          python3 -m unittest discover -s tools -p test_alpha_release_sbom.py
          python3 -m unittest discover -s tools -p test_alpha_release_graph.py

      - name: Validate Cloud ASR provider and adapter contracts
        run: |
          python3 tools/validate_cloud_asr_provider_contract.py
          python3 -m unittest discover -s tools -p test_cloud_asr_provider_contract.py

      - name: Validate transcript versioning and edit contracts
        run: |
          python3 tools/validate_transcript_versioning_contract.py
          python3 -m unittest discover -s tools -p test_transcript_versioning_contract.py

      - name: Validate Cloud identity authorization and ownership contracts
        run: |
          python3 tools/validate_cloud_identity_auth_contract.py
          python3 -m unittest discover -s tools -p test_cloud_identity_auth_contract.py

      - name: Run deterministic Cloud contract harness
        run: |
          python3 tools/cloud_contract_harness.py --self-test
          python3 -m unittest discover -s tools -p test_cloud_contract_harness.py
          python3 tools/cloud_contract_harness.py --verify-determinism

      - name: Validate Security and Identity architecture contract
        run: |
          python3 tools/validate_security_identity_contract.py
          python3 -m unittest discover -s tools -p test_security_identity_contract.py

      - name: Validate isolated capture PoC contracts
        run: python3 tools/validate_poc_capture.py

      - name: Validate isolated search PoC contracts
        run: python3 tools/validate_poc_search.py

      - name: Validate recovery governance package
        run: python3 tools/validate_poc_recovery_governance.py --self-test

      - name: Verify exact recovery dependency inventory
        run: python3 tools/verify_poc_recovery_dependency_inventory.py --online

      - name: Verify recovery execution remains fail-closed
        shell: bash
        run: |
          if python3 tools/check_poc_recovery_run_readiness.py; then
            echo "Recovery execution unexpectedly became allowed" >&2
            exit 1
          fi
          echo "Recovery execution is correctly blocked"

      - name: Verify pure-host VPN contract kernel
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          -p poc/vpn-contract-kernel
          :hostTest
          --offline
          --no-configuration-cache

      - name: Verify hermetic numeric-loopback VPN transport harness
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          -p poc/vpn-contract-kernel
          :transport-harness:loopbackTest
          --offline
          --no-configuration-cache

      - name: Check formatting and Kotlin static analysis
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          spotlessCheck
          detekt

      - name: Unit tests, instrumentation compilation, lint, and debug assembly
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :core:common:testDebugUnitTest
          :core:model:testDebugUnitTest
          :core:testing:testDebugUnitTest
          :poc:capture:testDebugUnitTest
          :poc:recovery:testDebugUnitTest
          :poc:search:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :poc:capture:compileDebugAndroidTestKotlin
          :poc:recovery:compileDebugAndroidTestKotlin
          :poc:search:compileDebugAndroidTestKotlin
          :app:lintDebug
          :core:common:lintDebug
          :core:model:lintDebug
          :core:testing:lintDebug
          :poc:capture:lintDebug
          :poc:recovery:lintDebug
          :poc:search:lintDebug
          :app:assembleDebug
          :poc:capture:assembleDebug
          :poc:recovery:assembleDebug
          :poc:search:assembleDebug

      - name: Verify Stage 8.1 audio Recovery boundary
        run: |
          python3 tools/validate_audio_recovery_boundary.py
          python3 -m unittest discover -s tools -p test_audio_recovery_boundary.py
          cd android
          ./gradlew --no-daemon --stacktrace :core:audio:testDebugUnitTest :core:audio:compileDebugAndroidTestKotlin :core:audio:lintDebug :core:audio:assembleDebug :core:audio:assembleRelease
          cd ..
          python3 tools/validate_audio_recovery_boundary.py --compiled

      - name: Verify compiled Alpha architecture boundaries and negative controls
        run: |
          python3 tools/verify_alpha_boundaries.py
          python3 -m unittest discover -s tools -p test_verify_alpha_boundaries.py

      - name: Verify unsigned release and locked runtime SBOM graph
        working-directory: android
        run: |
          ./gradlew --no-daemon --no-configuration-cache --dependency-verification strict --init-script ../tools/alpha_release_graph.init.gradle :app:assembleRelease :app:exportAlphaReleaseGraph
          python3 ../tools/alpha_release_sbom.py --graph app/build/reports/alpha-release-graph.json --source "${GITHUB_SHA}" --output app/build/reports/alpha-release-ci.cdx.json
          python3 ../tools/verify_apk_native_alignment.py app/build/outputs/apk/release/app-release-unsigned.apk --allowlist product-native-libs-allowlist.txt
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify Stage 8.2 encrypted persistence admission
        run: |
          python3 tools/validate_encrypted_persistence.py --compiled
          python3 tools/validate_encrypted_persistence_native.py
          python3 -m unittest discover -s tools -p 'test_encrypted_persistence*.py'
          python3 tools/validate_original_audio_lifecycle.py
          python3 -m unittest discover -s tools -p 'test_original_audio_lifecycle.py'

      - name: Verify Stage 8.3 recording latency remediation admission
        run: |
          python3 tools/validate_recording_latency.py
          python3 -m unittest discover -s tools -p 'test_recording_latency.py'

      - name: Verify Stage 8.3 product recording admission
        run: |
          python3 tools/validate_product_recording.py
          python3 -m unittest discover -s tools -p 'test_product_recording.py'

      - name: Verify locked search dependency artifact inventory
        run: python3 tools/poc_search_dependency_inventory.py --check

      - name: Verify exact search license and NOTICE inventory
        run: python3 tools/poc_search_license_notice_inventory.py --check

      - name: Verify native library admission and ELF alignment
        run: >-
          python3 tools/verify_apk_native_alignment.py
          android/app/build/outputs/apk/debug/app-debug.apk
          --allowlist android/product-native-libs-allowlist.txt

      - name: Verify capture PoC native library admission and ELF alignment
        run: >-
          python3 tools/verify_apk_native_alignment.py
          android/poc/capture/build/outputs/apk/debug/capture-debug.apk

      - name: Verify 16 KiB APK zip alignment
        run: >-
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify capture PoC 16 KiB APK zip alignment
        run: >-
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4
          android/poc/capture/build/outputs/apk/debug/capture-debug.apk

      - name: Upload Alpha foundation debug verification APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dora-alpha-foundation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload capture PoC debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dora-poc-capture-debug-apk
          path: android/poc/capture/build/outputs/apk/debug/capture-debug.apk
          if-no-files-found: error
          retention-days: 7

  search-smoke:
    name: search-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android API 36 emulator
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools"
          "emulator"
          "platforms;android-36"
          "build-tools;36.0.0"
          "system-images;android-36;google_apis;x86_64"

      - name: Create API 36 search smoke AVD
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-smoke-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
              --force \
              --name dora_search_smoke \
              --package "system-images;android-36;google_apis;x86_64" \
              --device pixel_6

      - name: Start API 36 emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-search-smoke-avd
        run: |
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_search_smoke \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect -accel on -memory 2048 \
            > "${RUNNER_TEMP}/dora-search-smoke-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"
              exit 1
            fi
            boot_completed=$("${ANDROID_HOME}/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot_completed}" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"
          exit 1

      - name: Run Room FTS4 schema, correctness, safety, mapping, and mutation smoke tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :poc:search:connectedDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.monumentogram.dora.poc.search.SearchSmokeInstrumentedTest

      - name: Print emulator log on failure
        if: failure()
        run: tail -n 300 "${RUNNER_TEMP}/dora-search-smoke-emulator.log"

  encrypted-persistence:
    name: encrypted-persistence-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android persistence test SDK
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"

      - name: Build encrypted persistence instrumentation
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :core:audio:assembleDebugAndroidTest

      - name: Create persistence test emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-persistence-avd
        run: |
          mkdir -p "${ANDROID_AVD_HOME}"
          printf 'no\n' |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
              --force --name dora_persistence \
              --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
              --device pixel_6

      - name: Start persistence test emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/dora-persistence-avd
        run: |
          sudo chmod 666 /dev/kvm
          nohup "${ANDROID_HOME}/emulator/emulator" @dora_persistence \
            -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect -accel on -memory 2048 \
            > "${RUNNER_TEMP}/dora-persistence-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            kill -0 "${emulator_pid}" 2>/dev/null || exit 1
            boot_completed=$("${ANDROID_HOME}/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "${boot_completed}" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify exact persistence and system authentication runtime inventory
        run: >-
          python3 tools/run_encrypted_persistence_device.py
          --serial emulator-5554 --expected-api ${{ matrix.api }} --expected-page-size 4096
          --apk android/core/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          --inventory docs/contracts/recording-latency-8.3-device-tests.json
          --receipt "${RUNNER_TEMP}/persistence-runtime-receipt.json"

      - name: Verify abrupt process death at durable persistence phases
        run: >-
          python3 tools/run_encrypted_persistence_crash.py
          --serial emulator-5554 --expected-api ${{ matrix.api }} --expected-page-size 4096
          --apk android/core/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          --receipt "${RUNNER_TEMP}/persistence-process-death-receipt.json"

      - name: Verify original audio lifecycle abrupt process death
        run: >-
          python3 tools/run_encrypted_persistence_crash.py --original-audio
          --serial emulator-5554 --expected-api ${{ matrix.api }} --expected-page-size 4096
          --apk android/core/audio/build/outputs/apk/androidTest/debug/audio-debug-androidTest.apk
          --receipt "${RUNNER_TEMP}/original-audio-process-death-receipt.json"

      - name: Build Stage 8.3 product UI instrumentation
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --dependency-verification strict :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify Stage 8.3 product UI controls
        run: >-
          python3 tools/run_product_recording_device.py
          --serial emulator-5554 --expected-api ${{ matrix.api }}
          --apk android/app/build/outputs/apk/debug/app-debug.apk
          --test-apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          --receipt "${RUNNER_TEMP}/product-recording-ui-receipt.json"

      - name: Upload content-free product recording UI receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-recording-ui-api${{ matrix.api }}
          path: ${{ runner.temp }}/product-recording-ui-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload content-free persistence runtime receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-runtime-api${{ matrix.api }}
          path: |
            ${{ runner.temp }}/persistence-runtime-receipt.json
            ${{ runner.temp }}/persistence-process-death-receipt.json
            ${{ runner.temp }}/original-audio-process-death-receipt.json
          if-no-files-found: error
          retention-days: 7
