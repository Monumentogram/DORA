name: Android CI

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    name: android-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable baseline is present
        run: git cat-file -e '1be83e2940a09f7b23e33b4cdf3827de2690f3fd^{commit}'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          check-latest: false

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android SDK 36
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Validate Stage 00 artifacts
        run: python3 tools/validate_stage00.py

      - name: Check formatting and Kotlin static analysis
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          spotlessCheck
          detekt

      - name: Unit tests, instrumentation compilation, lint, and debug assembly
        working-directory: android
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :core:common:testDebugUnitTest
          :core:model:testDebugUnitTest
          :core:testing:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :core:common:lintDebug
          :core:model:lintDebug
          :core:testing:lintDebug
          :app:assembleDebug

      - name: Verify native library admission and ELF alignment
        run: >-
          python3 tools/verify_apk_native_alignment.py
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify 16 KiB APK zip alignment
        run: >-
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          -c -P 16 -v 4
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Stage 00 debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dora-stage00-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
