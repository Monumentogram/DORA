permissions:
  contents: read

concurrency:
  group: stage0-vad-offline-data-host-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REQUIRED_BASELINE: 671f594074b37bb2b5c8e4a4c1026de909acf339
  REQUIRED_JAVA_VERSION: 17.0.20
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  host-regression:
    name: stage0-vad-offline-data-host-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact event SHA, baseline ancestry, and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_SHA}" ]]
          git cat-file -e "${REQUIRED_BASELINE}^{commit}"
          git merge-base --is-ancestor "${REQUIRED_BASELINE}" HEAD
          [[ -z "$(git status --porcelain)" ]]

      - name: Set up the exact Java 17 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
          check-latest: false

      - name: Verify validator runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(javac -version 2>&1)" == "javac ${REQUIRED_JAVA_VERSION}" ]]
          [[ "$(jdeps --version 2>&1)" == "${REQUIRED_JAVA_VERSION}" ]]
          [[ "$(javap -version 2>&1)" == "${REQUIRED_JAVA_VERSION}" ]]
          java_version="$(java -version 2>&1)"
          [[ "${java_version%%$'\n'*}" == "openjdk version \"${REQUIRED_JAVA_VERSION}\" 2026-07-21" ]]
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          [[ -n "${RUNNER_TEMP}" && -d "${RUNNER_TEMP}" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Exercise fail-closed inventory validation
        run: >-
          python3 -B tools/run_stage0_vad_offline_data_host_regression.py
          --self-test

      - name: Revalidate the exact VAD Offline Data host inventory
        run: python3 -B tools/run_stage0_vad_offline_data_host_regression.py

      - name: Require complete cleanup and an unchanged worktree
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
          generated="$(find . -path ./.git -prune -o -type f \( -name '*.class' -o -name '*.pcm' -o -name 'dora-poc-data-control-plane.synthetic' \) -print -quit)"
          [[ -z "${generated}" ]]
          printf '%s\n' 'STAGE0_VAD_OFFLINE_DATA_HOST_REGRESSION_CLEANUP_OK'
