# Enable only with EnableAcmeHttpChallenge=true. No API or redirect on HTTP.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/dora-acme-error.log crit;
    client_max_body_size 1k;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
