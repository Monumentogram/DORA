// ADR-RECORDING-011: only these unchanged historical session tests require >300s.
// The technical timeline/projection tests still run; original tests remain at the C3 baseline.
allprojects {
    tasks.withType(Test).configureEach {
        if (project.path == ':core:audio') {
            filter {
                excludeTestsMatching 'com.monumentogram.dora.audio.recording.TechnicalRotationSessionTest.capInsideBlockPreservesHashSourceIdentityAndCaptureEpoch'
                excludeTestsMatching 'com.monumentogram.dora.audio.recording.TechnicalRotationSessionTest.pauseResumeAfterRotationUsesFreshEpochAndKeepsLogicalIdentity'
                excludeTestsMatching 'com.monumentogram.dora.audio.recording.SegmentationMetadataSessionTest.physicalCapAndOverlapAreDurableSourceViews'
                excludeTestsMatching 'com.monumentogram.dora.audio.recording.RecordingSegmentationTest.vadOnOffAndOverlapProduceIdenticalCanonicalHashAcrossTwoCaps'
            }
        }
    }
}
