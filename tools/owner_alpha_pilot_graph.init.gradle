import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.FileCollectionDependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult

// Run without private inputs: their fixed AAR/model pins are separately bound by
// the owner artifact audit and SBOM. File dependencies can never silently vanish.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('exportOwnerAlphaPilotGraph') {
        doLast {
            def configuration = app.configurations.getByName('ownerPilotRuntimeClasspath')
            def resolved = configuration.incoming.resolutionResult
            def projectConfigurations = [(':app'): configuration.name]
            resolved.allDependencies.each { dependency ->
                if (dependency instanceof ResolvedDependencyResult && dependency.selected.id instanceof ProjectComponentIdentifier) {
                    def path = dependency.selected.id.projectPath
                    def attributes = dependency.resolvedVariant.attributes
                    def key = attributes.keySet().find { it.name == 'com.android.build.api.attributes.BuildTypeAttr' }
                    if (key == null) throw new GradleException('Missing actual selected project build type')
                    def type = attributes.getAttribute(key).toString()
                    if (path != ':app' && type != 'release') throw new GradleException('Pilot selected a non-release project variant')
                    def runtime = type + 'RuntimeClasspath'
                    if (projectConfigurations.containsKey(path) && projectConfigurations[path] != runtime) {
                        throw new GradleException('Conflicting selected project variants')
                    }
                    projectConfigurations[path] = runtime
                }
            }
            resolved.allComponents.each { component ->
                if (component.id instanceof ProjectComponentIdentifier) {
                    def path = component.id.projectPath
                    if (!projectConfigurations.containsKey(path)) throw new GradleException('Unobserved project variant')
                    def runtime = gradle.rootProject.project(path).configurations.getByName(projectConfigurations[path])
                    if (runtime.allDependencies.any { it instanceof FileCollectionDependency }) {
                        throw new GradleException('Export graph without private file inputs; bind them in the artifact audit')
                    }
                }
            }
            def idOf = { id ->
                if (id instanceof ModuleComponentIdentifier) return "maven:${id.group}:${id.module}:${id.version}".toString()
                if (id instanceof ProjectComponentIdentifier) return "project:${id.projectPath}".toString()
                throw new GradleException('Unsupported pilot component identity')
            }
            def artifacts = [:].withDefault { [] }
            configuration.incoming.artifactView {
                componentFilter { id ->
                    if (!(id instanceof ModuleComponentIdentifier) && !(id instanceof ProjectComponentIdentifier)) {
                        throw new GradleException('Unadmitted pilot artifact identity')
                    }
                    id instanceof ModuleComponentIdentifier
                }
            }.artifacts.artifacts.each { artifact ->
                def digest = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                artifacts[idOf(artifact.id.componentIdentifier)] << [name: artifact.file.name, sha256: digest]
            }
            def components = [], relationships = [], unresolved = []
            def requested = [] as Set
            resolved.allComponents.each { component ->
                def id = component.id
                def ref = idOf(id)
                if (id instanceof ModuleComponentIdentifier) {
                    components << [id: ref, kind: 'maven', group: id.group, name: id.module, version: id.version,
                                   artifacts: artifacts[ref].sort { a, b -> a.name <=> b.name }]
                } else {
                    components << [id: ref, kind: 'project', path: id.projectPath]
                }
                def dependencies = [] as Set
                component.dependencies.each { dependency ->
                    if (dependency.requested.hasProperty('version') && dependency.requested.version) requested << dependency.requested.version
                    if (dependency instanceof ResolvedDependencyResult) dependencies << idOf(dependency.selected.id)
                    else unresolved << dependency.requested.displayName
                }
                relationships << [ref: ref, dependsOn: dependencies.toList().sort()]
            }
            def graph = [configuration: configuration.name, root: 'project::app',
                         project_configurations: projectConfigurations.sort(),
                         components: components.sort { a, b -> a.id <=> b.id },
                         dependencies: relationships.sort { a, b -> a.ref <=> b.ref },
                         requested_versions: requested.toList().sort(), unresolved: unresolved.sort()]
            def destination = new File(app.layout.buildDirectory.get().asFile, 'reports/owner-alpha-pilot-graph.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(graph)) + '\n'
            println "Owner pilot graph exported: ${components.size()} components"
        }
    }
}
