      source_sha256: cc73233605c71872a5612cbb0091db615d33c58ddc5d3ceab8d49c185736b574
      captured_at_utc: "2026-08-05T09:19:46.627123Z"
      application_version: 0.1.0-poc-capture-001
      commit: f351695e0297aa550034d7dfdd70146fab0b10db
      kind: remote_physical
      manufacturer: samsung
