schema_version: 1
matrix_id: dora-mvp1-stage0-device-matrix
updated: "2026-08-05"
stage: "Stage 0B"
owner_task: "POC-DEVICE-001"
inventory_confirmed: true
production_support_claims_allowed: false

owner_decision:
  id: OD-06
  status: Approved
  approved_on: "2026-08-04"
  owner: "Project owner"
  choice: B
  scope: "One owner-provided physical Android phone for the first exploratory run."
  additional_device_procurement: false

first_exploratory_campaign:
  mode: single_owner_physical_phone
  status: blocked_pending_d2_free_storage_preflight
  measured_run_allowed: false
  unblock_condition: >-
    Free app storage until a new sanitized profile reports at least 8192 MiB,
    then repeat device preparation and export before Run A.
  required_automatic_fields:
    - sanitized_device_model
    - android_api
    - os_build_or_firmware
    - abi
    - ram_mb
  discovery_method: >-
    Use the Dora Capture PoC sanitized device-profile export in the remote manual-device
    workflow; do not transcribe characteristics manually or copy device serial, account
    data or private local paths into public evidence.
  profile_assignment: >-
    owner-phone-001 is closest to D2 by Android API, primary ABI and RAM. Record D2 as
    available inventory, but block measured execution while current free app storage
    remains below the D2 start threshold. Do not infer any other profile or matrix coverage.
  matrix_support_verdict: INCONCLUSIVE
  measured_run_result_rule: >-
    FAIL is allowed when an approved failure gate triggers; otherwise missing D1-D7
    coverage requires INCONCLUSIVE. PASS is forbidden for this campaign.
  forbidden_claims:
    - "Global PASS for D1-D7"
    - "Supported Android devices"
    - "Eight-hour behavior beyond the discovered device and recorded conditions"

status_vocabulary:
  - available
  - required
  - optional
  - unknown

status_semantics:
  available: "A specific device and firmware were confirmed by the owner and recorded as evidence."
  required: "Coverage is required, but this value does not claim that hardware is available."
  optional: "Useful supplemental coverage that does not block the named PoC gate."
  unknown: "Requirement or availability is not yet resolved."

